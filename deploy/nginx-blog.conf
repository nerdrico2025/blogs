# ALTERNATIVA SEM EASYPANEL: o caminho principal é o Docker no Easypanel (docs/deploy-easypanel.md).
# Este arquivo só serve para instalar o blog direto num VPS com Nginx + systemd.
# Nginx do blog. Instalado por setup-server.sh, que troca __DOMAIN__ e __ROOT__.
# Estático em __ROOT__/current (symlink trocado a cada build), imagens direto do disco,
# /wp-json/ e /health para a API em 127.0.0.1:8787.

map $sent_http_content_type $blog_cache_control {
    default                     "public, max-age=0, must-revalidate";
    ~*text/html                 "public, max-age=0, must-revalidate";
    ~*application/xml           "public, max-age=600";
    ~*application/rss\+xml      "public, max-age=600";
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # "listen ... http2" funciona do Nginx 1.18 ao atual (no 1.25+ só gera um aviso)
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    # Preenchido pelo certbot (setup-server.sh)
    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:blog_ssl:10m;

    root __ROOT__/current;
    index index.html;
    charset utf-8;
    server_tokens off;

    include /etc/nginx/snippets/blog-security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/css text/plain text/xml application/xml application/rss+xml application/json application/javascript image/svg+xml;
    include /etc/nginx/snippets/blog-brotli*.conf;

    error_page 404 /404.html;

    # API de publicação (Wordbee)
    location /wp-json/ {
        client_max_body_size 16m;
        client_body_timeout 60s;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_request_buffering on;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/blog-security-headers.conf;
    }
    location = /health {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header X-Forwarded-For $remote_addr;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/blog-security-headers.conf;
    }

    # Imagens enviadas: abrem na hora, sem esperar o build. Nomes nunca se repetem.
    location /wp-content/uploads/ {
        alias __ROOT__/uploads/;
        location ~ \.json$ { return 404; }
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/blog-security-headers.conf;
        try_files $uri =404;
    }

    # Endereços do WordPress que não existem aqui
    location = /feed/ { return 301 /feed.xml; }
    location ~ ^/(wp-admin|wp-login\.php|xmlrpc\.php|wp-includes) { return 404; }
    location ~ /\. { return 404; }

    # Assets com hash no nome
    location ~ ^/(_astro|fonts)/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/blog-security-headers.conf;
        try_files $uri =404;
    }
    location /pagefind/ {
        add_header Cache-Control "public, max-age=600";
        include /etc/nginx/snippets/blog-security-headers.conf;
        try_files $uri =404;
    }
    location /brand/ {
        add_header Cache-Control "public, max-age=86400";
        include /etc/nginx/snippets/blog-security-headers.conf;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control $blog_cache_control;
        include /etc/nginx/snippets/blog-security-headers.conf;
        try_files $uri $uri/ =404;
    }
}
